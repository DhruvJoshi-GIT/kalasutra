<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KalaSutra — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@500;700&display=swap">
<script>(function(){try{if(localStorage.getItem('ks-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}})();</script>
<style>
/* ── KalaSutra system: ink on paper, rounded ─────────────────────── */
:root{--bg:#F6F5F0;--fg:#111111;--muted:#555555;--acc:#E2A100;--acc2:#B07A00;--sec:#E7E4DA;--sec2:#DDD9CC;--ink:#111111;--ok:#1F6B3A;--err:#B3261E;
 --r:14px;--rs:10px;--pad:clamp(14px,1.8vw,32px);--cap:224px;--capc:58px}
.dark{--bg:#111111;--fg:#F6F5F0;--muted:#A8A49A;--acc:#E2A100;--acc2:#F2B92E;--sec:#1E1E1C;--sec2:#2A2A27;--ink:rgba(246,245,240,.55);--ok:#4CAF6E;--err:#E05A4C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);transition:background-color .3s ease,color .3s ease}
body{font-family:'Archivo','Arial Narrow',system-ui,sans-serif;font-weight:500;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.mono{font-family:'IBM Plex Mono',Consolas,monospace}
.hi{font-family:'Noto Sans Devanagari','Nirmala UI',sans-serif}
.label{font-family:'IBM Plex Mono',Consolas,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.display{font-weight:900;text-transform:uppercase;letter-spacing:-.04em;line-height:.95}
.muted{color:var(--muted)}
.ok{color:var(--ok)}.err{color:var(--err)}
/* view transition: circle reveal from the toggle */
::view-transition-old(root){animation:none;z-index:1}
::view-transition-new(root){animation:vt .9s cubic-bezier(.22,1,.36,1) forwards;z-index:2}
@keyframes vt{from{clip-path:circle(0% at calc(100% - 2.9rem) calc(100% - 2.9rem))}to{clip-path:circle(160% at calc(100% - 2.9rem) calc(100% - 2.9rem))}}
::view-transition-image-pair(root){isolation:isolate}
/* tactile (PrithviNet behaviour) */
.neo{box-shadow:3px 3px 0 0 var(--ink);transition:box-shadow .12s ease-in-out,transform .12s ease-in-out,background-color .15s,color .15s;will-change:transform;user-select:none;-webkit-tap-highlight-color:transparent}
.neo:hover:not(:disabled){box-shadow:4px 4px 0 0 var(--ink);transform:translate(-1px,-1px)}
.neo:active:not(:disabled){box-shadow:0 0 0 0 var(--ink);transform:translate3d(3px,3px,0)}
.press{transition:transform .08s linear,background-color .1s linear,color .1s linear}
.press:active{transform:translate(2px,2px)}
@keyframes sun-spin{to{transform:rotate(360deg)}}
@keyframes moon-glow{0%,100%{filter:drop-shadow(0 0 3px rgba(226,161,0,.5))}50%{filter:drop-shadow(0 0 9px rgba(226,161,0,.9))}}
.sun{animation:sun-spin 12s linear infinite}.moon{animation:moon-glow 3s ease-in-out infinite}
/* primitives */
.box{border:2px solid var(--fg);border-radius:var(--r);background:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border:2px solid var(--fg);border-radius:var(--rs);background:var(--bg);color:var(--fg);font:900 12px/1 'Archivo',sans-serif;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;white-space:nowrap}
.btn.lg{min-height:52px;padding:0 28px;font-size:14px}
.btn.sm{min-height:36px;padding:0 14px;font-size:11px}
.btn.ink{background:var(--fg);color:var(--bg)}
.btn.acc{background:var(--acc);color:#111}
.btn.ghost{border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{width:100%;min-height:46px;background:var(--bg);color:var(--fg);border:2px solid var(--fg);border-radius:var(--rs);padding:10px 14px;font:500 15px 'Archivo',sans-serif;transition:box-shadow .08s linear}
textarea{min-height:90px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,textarea:focus,select:focus{outline:none;box-shadow:3px 3px 0 0 var(--acc)}
.field{display:flex;flex-direction:column;gap:4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.form .full{grid-column:1/-1}
.empty{padding:26px 20px;border:2px dashed var(--fg);border-radius:var(--r);text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
/* header */
.bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:12px var(--pad);background:var(--bg);border-bottom:2px solid var(--fg)}
.logo{width:48px;height:48px;flex:none;border:2px solid var(--fg);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;letter-spacing:-.04em;background:var(--fg);color:var(--bg);cursor:pointer}
.search{flex:1;display:flex;align-items:center;gap:10px;padding:0 16px;border:2px solid var(--fg);border-radius:999px;min-height:46px;max-width:720px;color:var(--muted)}
.search input{border:0;min-height:0;padding:0;background:transparent;box-shadow:none!important;font-size:14px;border-radius:0}
.icons{display:flex;gap:8px;margin-left:auto}
.icell{position:relative;width:54px;height:48px;border:2px solid var(--fg);border-radius:var(--rs);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;background:var(--bg)}
.icell:hover{background:var(--sec)}
.icell .k{display:flex;align-items:center;justify-content:center;height:20px}.icell .k svg{width:19px;height:19px}
.icell .t{font:400 8px/1 'IBM Plex Mono';letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.icell.acc{background:var(--acc);color:#111}.icell.acc .t{color:#111}.icell.acc:hover{background:var(--acc2)}
.badge{position:absolute;top:-9px;right:-9px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--acc);color:#111;border:2px solid var(--fg);font:900 11px/1 'Archivo';display:flex;align-items:center;justify-content:center}
.badge:empty{display:none}
/* floating capsule */
.cap{position:fixed;left:14px;top:86px;z-index:30;width:var(--cap);border:2px solid var(--fg);border-radius:18px;background:var(--bg);box-shadow:4px 4px 0 0 var(--ink);display:flex;flex-direction:column;overflow:hidden;transition:width .2s ease;max-height:calc(100vh - 110px);overflow-y:auto;scrollbar-width:none}
body.side-closed .cap{width:var(--capc)}
.cap .tg{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;border-bottom:2px solid var(--fg);cursor:pointer;font:900 11px 'Archivo';text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.cap .tg:hover{background:var(--sec)}
body.side-closed .cap .tg{justify-content:center;padding:11px 0}
body.side-closed .cap .tg .tx{display:none}
.cap a{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;font:700 12px 'Archivo';text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.cap a:hover{background:var(--sec)}
.cap a .ab{width:28px;height:28px;border:1.5px solid var(--fg);border-radius:8px;font:900 10px 'Archivo';display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:0}
.cap a.on{background:var(--fg);color:var(--bg)}.cap a.on .ab{border-color:var(--bg)}
body.side-closed .cap a{padding:0;justify-content:center}
body.side-closed .cap a .tx,body.side-closed .cap .mk{display:none}
.cap .mk{margin-top:auto;padding:12px 14px;border-top:2px solid var(--fg);font-size:12px}
main{padding:0 var(--pad) 60px calc(var(--cap) + 28px + var(--pad) - 14px);transition:padding .2s;min-height:calc(100vh - 74px)}
body.side-closed main{padding-left:calc(var(--capc) + 28px + var(--pad) - 14px)}
main.plain{padding-left:var(--pad)}
/* grids + tiles */
.grid{display:grid;gap:clamp(12px,1.2vw,20px);padding:12px 0 20px}
.grid.shop{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));grid-auto-flow:dense}  /* as many ~260px tiles as fit; the capsule just takes one column away */
.card{border:2px solid var(--fg);border-radius:12px;overflow:hidden;background:var(--bg);cursor:pointer;display:flex;flex-direction:column;transition:box-shadow .1s linear,transform .1s linear;text-align:left}
.card:hover{box-shadow:4px 4px 0 0 var(--ink);transform:translate(-1px,-1px)}
.card:active{box-shadow:none;transform:translate(2px,2px)}
.card .img{aspect-ratio:4/3;border-bottom:1px solid var(--fg);position:relative;overflow:hidden;background:var(--sec)}
.card .img img,.thumb img,.pimg img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block}
.card .wl{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:999px;background:var(--bg);border:1.5px solid var(--fg);display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
.card .wl.on{background:var(--acc);color:#111}
.card .in{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.card .mk{display:flex;align-items:center;gap:6px;font-size:10px;min-width:0}
.card .mk img{width:20px;height:20px;border-radius:999px;object-fit:cover;border:1px solid var(--fg);flex:none}
.card .mk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .n{font-weight:700;font-size:13px;line-height:1.25}
.card .craft{font:400 11px 'IBM Plex Mono';color:var(--muted);letter-spacing:.02em}
.card .p{font-weight:900;font-size:16px;margin-top:2px}
.card .p s{font:400 11px 'IBM Plex Mono';color:var(--muted);margin-left:6px}
.card.wide{grid-column:span 2}
.card.wide .img{aspect-ratio:auto;flex:1;min-height:clamp(160px,12vw,260px)}
.card.wide .img img{position:absolute;inset:0}
.card.wide .n{font-size:15px}
/* featured story tile */
.feat{border:2px solid var(--fg);border-radius:var(--r);overflow:hidden;margin-top:18px;background:var(--bg)}
.feat .ph{position:relative;border-right:2px solid var(--fg);min-height:clamp(300px,30vw,700px);max-height:min(62vh,760px);background:var(--sec);cursor:pointer;overflow:hidden}
.feat .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 8%;display:block}
.feat .ph .tag{position:absolute;left:14px;top:14px;background:var(--acc);color:#111;padding:5px 10px;border-radius:8px;font:900 11px 'Archivo';text-transform:uppercase;letter-spacing:.06em}
.feat .tx{padding:clamp(20px,2.4vw,48px);display:flex;flex-direction:column;gap:14px;justify-content:center}
.feat .who{display:flex;align-items:center;gap:10px}
.feat .who img{width:46px;height:46px;border-radius:999px;border:2px solid var(--fg);object-fit:cover}
.feat h2{font:900 clamp(24px,2.3vw,44px)/1 'Archivo';text-transform:uppercase;letter-spacing:-.04em}
.feat q{font-size:clamp(14px,1vw,18px);line-height:1.6;quotes:'“' '”'}
.feat .pr{font:900 clamp(20px,1.5vw,28px)/1 'Archivo'}
.sortsel{width:auto;min-height:38px;padding:6px 32px 6px 12px;font:700 11px 'Archivo';text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 0 4px}
.sec h2{font:900 20px/1 'Archivo';text-transform:uppercase;letter-spacing:-.03em}
.sec h1{font:900 clamp(26px,2.6vw,40px)/1 'Archivo';text-transform:uppercase;letter-spacing:-.04em}
.strip{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.strip .card{flex:0 0 150px;scroll-snap-align:start}
.strip .card .in{padding:8px 10px}.strip .card .n{font-size:12px}.strip .card .p{font-size:12px}.strip .card .wl{display:none}
/* featured slider (the opening tile) */
.feat{position:relative}
.ftrack{display:flex;transition:transform .65s cubic-bezier(.22,1,.36,1);will-change:transform}
.fslide{flex:0 0 100%;min-width:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.feat .ctrl{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:8px;z-index:2}
.feat .ctrl .nav{width:36px;height:36px;border:2px solid var(--fg);border-radius:10px;background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:900;user-select:none;box-shadow:3px 3px 0 0 var(--ink)}
.feat .ctrl .nav:hover{background:var(--fg);color:var(--bg)}
.feat .ctrl .dots{display:flex;gap:5px;margin:0 6px}
.feat .ctrl .d{width:22px;height:5px;border-radius:3px;background:rgba(246,245,240,.55);border:1px solid rgba(17,17,17,.4);cursor:pointer}
.feat .ctrl .d.on{background:var(--acc)}
/* logo: a name tile at the top of the page, a square K once scrolled */
.logo{width:auto;min-width:48px;padding:0;transition:padding .28s cubic-bezier(.22,1,.36,1);overflow:hidden;white-space:nowrap;letter-spacing:-.03em}
.logo .nm{display:inline-block;max-width:0;overflow:hidden;vertical-align:bottom;transition:max-width .28s cubic-bezier(.22,1,.36,1)}
.logo.wide{padding:0 16px}
.logo.wide .nm{max-width:200px}
/* panels (wishlist / support) */
.panel{position:fixed;top:78px;right:var(--pad);width:360px;max-width:calc(100vw - 28px);background:var(--bg);border:2px solid var(--fg);border-radius:var(--r);box-shadow:5px 5px 0 0 var(--ink);display:none;z-index:45;overflow:hidden}
.panel.on{display:block}
.panel h4{padding:12px 16px;border-bottom:2px solid var(--fg);font:900 13px 'Archivo';text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.panel ul{list-style:none;max-height:320px;overflow:auto}
.panel li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--fg);font-size:13px}
.panel li>a:hover{background:var(--sec);border-radius:8px}
.panel li:last-child{border-bottom:0}
.panel li .thumb{width:44px;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--fg);flex:none;cursor:pointer}
/* product modal */
.mbg{position:fixed;inset:0;z-index:80;background:rgba(17,17,17,.6);display:none;justify-content:center;padding:4vh 16px;overflow:auto}
.mbg.on{display:flex}
.modal{width:min(1040px,100%);height:max-content;background:var(--bg);border:2px solid var(--fg);border-radius:18px;box-shadow:8px 8px 0 0 var(--ink);position:relative;overflow:hidden;margin-bottom:4vh}
.modal .x{position:absolute;top:12px;right:12px;width:40px;height:40px;border:2px solid var(--fg);border-radius:10px;background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center;font:900 16px 'Archivo';cursor:pointer;z-index:2}
.modal .top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.modal .gal{border-right:2px solid var(--fg);overflow:hidden;aspect-ratio:1;background:var(--sec)}
.modal .gal img{width:100%;height:100%;object-fit:cover;object-position:center 15%;display:block}
.modal .info{padding:28px 60px 24px 28px;display:flex;flex-direction:column;gap:12px}
.modal .info h2{font:900 clamp(22px,2vw,32px)/1 'Archivo';text-transform:uppercase;letter-spacing:-.04em}
.modal .price{font:900 30px/1 'Archivo'}.modal .price s{font:400 14px 'IBM Plex Mono';color:var(--muted);margin-left:8px}
.modal section{border-top:2px solid var(--fg);padding:20px 28px}
.modal h3{font:900 14px 'Archivo';text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:8px 14px;font-size:14px}
.qty{display:inline-flex;border:2px solid var(--fg);border-radius:var(--rs);overflow:hidden;background:var(--bg)}
.qty button{width:38px;height:38px;border:0;background:transparent;color:var(--fg);font:900 16px 'Archivo';cursor:pointer}
.qty button:hover{background:var(--sec)}
.qty span{min-width:40px;display:flex;align-items:center;justify-content:center;font-weight:900;border-left:1px solid var(--fg);border-right:1px solid var(--fg)}
.stars{color:var(--acc);letter-spacing:2px;font-size:15px}
.stars.pick span{cursor:pointer;opacity:.35}.stars.pick span.on{opacity:1}
.rev{border-top:1px solid var(--fg);padding:12px 0;font-size:14px}
.rev .who{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:4px}
/* cart / checkout */
.split{display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,28vw,440px);gap:24px;align-items:start}
.sticky{position:sticky;top:92px}
.crow{display:flex;gap:14px;align-items:center;padding:14px;border:2px solid var(--fg);border-radius:var(--r);flex-wrap:wrap;margin-bottom:12px}
.crow .thumb{width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--fg);flex:none;cursor:pointer}
.crow .nm{flex:1 1 200px;min-width:0}
.line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--fg);font-size:14px}
.line:last-child{border-bottom:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--fg);border-radius:var(--rs);cursor:pointer;font-size:13px;margin-bottom:8px}
.opt.on{background:var(--sec)}
.opt .rd{width:18px;height:18px;border:2px solid var(--fg);border-radius:999px;flex:none;margin-top:2px}
.opt.on .rd{background:var(--acc)}
/* account */
.acc-item{border:2px solid var(--fg);border-radius:var(--r);overflow:hidden;margin-bottom:12px;background:var(--bg)}
.acc-item .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;cursor:pointer}
.acc-item .hd:hover{background:var(--sec)}
.acc-item .bd{display:none;border-top:2px solid var(--fg);padding:16px 20px}
.acc-item.on .bd{display:block}
.avatar{width:96px;height:96px;border:3px solid var(--fg);border-radius:28px;display:flex;align-items:center;justify-content:center;font:900 34px 'Archivo';flex:none;background:var(--sec)}
/* seller bits */
.check{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--fg);font-weight:700}
.check .m{width:22px;height:22px;border:2px solid var(--fg);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px}
.check.ok .m{background:var(--fg);color:var(--bg)}
.diamond{width:150px;height:150px;transform:rotate(45deg);border:2px solid var(--fg);border-radius:22px;display:flex;align-items:center;justify-content:center;margin:24px auto;background:var(--bg);box-shadow:4px 4px 0 0 var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s,opacity .2s}
.diamond:hover:not(.off){transform:rotate(45deg) translate(-1px,-1px);box-shadow:6px 6px 0 0 var(--ink)}
.diamond:active:not(.off){transform:rotate(45deg) translate(3px,3px);box-shadow:0 0 0 0 var(--ink)}
.diamond.off{opacity:.35;cursor:not-allowed;box-shadow:none}
.diamond span{transform:rotate(-45deg);font:900 13px 'Archivo';text-transform:uppercase;letter-spacing:.06em;text-align:center}
.crumb{display:inline-flex;align-items:center;flex-wrap:wrap;border:2px solid var(--fg);border-radius:var(--rs);overflow:hidden;margin:20px 0 0}
.crumb span{padding:9px 14px;font:700 12px 'Archivo';text-transform:uppercase;letter-spacing:.04em;border-right:1px solid var(--fg)}
.crumb span:last-child{border-right:0}
#theme{position:fixed;right:24px;bottom:24px;--nav:0px;width:46px;height:46px;border:2px solid var(--fg);border-radius:12px;background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:60}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font:700 13px 'Archivo';opacity:0;transition:opacity .2s,transform .2s;z-index:90;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
/* login page scales with the viewport */
.login .label{font-size:clamp(12px,.7vw,20px)}
.login input{min-height:clamp(46px,3vw,80px);font-size:clamp(15px,1vw,26px);padding:clamp(10px,.8vw,20px) clamp(14px,1vw,26px)}
.login .btn.lg{min-height:clamp(52px,3.2vw,86px);font-size:clamp(14px,.9vw,24px)}
/* wide screens: bigger photos, not more of them */
@media (min-width:2200px){.grid.shop{grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr))}.card .n{font-size:15px}.card .p{font-size:18px}.card .craft{font-size:12px}.card .mk{font-size:11px}.card .mk img{width:24px;height:24px}}
/* bottom nav (phones) */
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--bg);border-top:2px solid var(--fg);padding:6px 6px calc(6px + env(safe-area-inset-bottom));grid-template-columns:repeat(5,1fr)}
.bnav a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;font:700 9px 'IBM Plex Mono';letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.bnav a svg{width:22px;height:22px}

  <a class="logo press" id="logo" href="#home" title="Home">K<span class="nm">alaSutra</span></a>
  <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Search crafts, makers, places…" value="${esc(state.q)}" oninput="search(this.value)"></div>
  <div class="icons">
    <a class="icell press" href="#account" title="Your account"><span class="k">${ICON.user}</span><span class="t">Profile</span></a>
    <a class="icell press" href="#cart" title="Cart"><span class="k">${ICON.cart}</span><span class="t">Cart</span><span class="badge">${cartCount()||''}</span></a>
    <a class="icell press" href="javascript:void(0)" onclick="togglePanel('wish')" title="Wishlist"><span class="k">${ICON.heart}</span><span class="t">Wishlist</span><span class="badge">${wish.length||''}</span></a>
    <a class="icell press acc" href="javascript:void(0)" onclick="togglePanel('support')" title="Sell / Support"><span class="k">${ICON.rupee}</span><span class="t">Sell</span></a>
    <a class="icell press" href="javascript:void(0)" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top"><span class="k">${ICON.up}</span><span class="t">Top</span></a>
  </div>`;
  paintTop(); paintBnav();
  const q=document.getElementById('q'); if(document.activeElement && document.activeElement.id==='q'){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
}
/* logo: full name while at the top of the page, square K once scrolled */
function paintTop(){ const l=document.getElementById('logo'); if(l) l.classList.toggle('wide', window.scrollY < 40); }
window.addEventListener('scroll', paintTop, {passive:true});
/* bottom navigation — phones only (CSS hides it above 600px) */
function paintBnav(){
  const key = (location.hash||'#home').slice(1).split('/')[0];
  const on = k => (k===key || (k==='home' && key==='shop')) ? 'on' : '';
  document.getElementById('bnav').innerHTML = `
    <a class="${on('home')}" href="#home">${ICON.home}<span>Home</span></a>
    <a class="${document.body.classList.contains('cats-open')?'on':''}" href="javascript:void(0)" onclick="toggleCats()">${ICON.grid}<span>Categories</span></a>
    <a class="${on('cart')}" href="#cart">${ICON.cart}<span>Cart</span><b class="badge">${cartCount()||''}</b></a>
    <a href="javascript:void(0)" onclick="togglePanel('wish')">${ICON.heart}<span>Wishlist</span><b class="badge">${wish.length||''}</b></a>
    <a class="${on('account')||on('login')||on('seller')||on('upload')}" href="#account">${ICON.user}<span>Profile</span></a>`;
}
function toggleCats(force){ document.body.classList.toggle('cats-open', force); paintBnav(); }
function paintCap(active){
  const open = !document.body.classList.contains('side-closed');
  document.getElementById('cap').innerHTML = `
  <div class="tg" onclick="toggleSide()" title="${open?'Collapse':'Expand'} categories"><span class="tx">Categories</span><span>${open?'‹':'›'}</span></div>
  ${CATS.map(c=>`<a href="#shop/${c.k}" class="press ${c.k===active?'on':''}" title="${c.n}"><span class="ab">${c.ab}</span><span class="tx">${c.n}</span></a>`).join('')}
  <div class="mk"><div class="label muted">Makers</div><a href="#artist/priya" style="min-height:0;padding:4px 0;text-transform:none;font-size:12px">Priya Devi · Bagru →</a><a href="#artist/meera" style="min-height:0;padding:4px 0;text-transform:none;font-size:12px">Meera Kumari · Madhubani →</a></div>`;
}
function toggleSide(){ document.body.classList.toggle('side-closed'); db.set('ks-side', document.body.classList.contains('side-closed')?'closed':'open'); paintCap(currentCat()); }
function currentCat(){ const h=(location.hash||'#home').slice(1).split('/'); return h[0]==='shop' ? (h[1]||'all') : (h[0]==='home'?'all':''); }
function togglePanel(id){ ['wish','support'].forEach(k=>{ const el=document.getElementById(k); el.classList.toggle('on', k===id ? !el.classList.contains('on') : false); }); if(id==='wish') paintWish(); }
document.addEventListener('click', e=>{ if(!e.target.closest('.panel') && !e.target.closest('.icell') && !e.target.closest('.bnav')) document.querySelectorAll('.panel.on').forEach(p=>p.classList.remove('on')); if(document.body.classList.contains('cats-open') && !e.target.closest('.cap') && !e.target.closest('.bnav')) toggleCats(false); });
function paintWish(){
  const items = wish.map(byId).filter(Boolean);
  document.getElementById('wish').innerHTML = `<h4>Wishlist <span class="mono" style="font-weight:400">${items.length}</span></h4>
  ${items.length ? `<ul>${items.map(p=>`<li><a href="javascript:void(0)" onclick="togglePanel();openProduct(${p.id})" title="Open product" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0"><div class="thumb">${pic(p)}</div><div style="flex:1;min-width:0"><div style="font-weight:700;line-height:1.2;text-decoration:underline">${esc(p.n)}</div><span class="mono muted" style="font-size:12px">${fmt(p.price)}</span></div></a><button class="btn sm neo" onclick="addToCart(${p.id})">+ Cart</button><button class="btn sm ghost" onclick="toggleWish(${p.id})" title="Remove">✕</button></li>`).join('')}</ul>
  <div style="padding:10px 14px;border-top:2px solid var(--fg)"><button class="btn ink neo" style="width:100%" onclick="wish.forEach(id=>addToCart(id));">Move all to cart</button></div>`
  : `<div style="padding:18px"><div class="empty">Nothing saved yet.<br>Tap ♥ on any product to keep it here.</div></div>`}`;
}
document.getElementById('support').innerHTML = `<h4>Sell &amp; support</h4>
  <div style="padding:14px;display:flex;flex-direction:column;gap:10px">
    <a class="btn acc neo" href="#login" onclick="togglePanel()">Open a shop → seller login</a>
    <div class="box" style="padding:12px"><div class="label muted">Contact</div><div class="mono" style="font-size:13px;margin-top:6px">Call 1800-[NUMBER]<br>WhatsApp: [NUMBER]<br>help@kalasutra.in</div></div>
    <div class="hi" style="font-size:13px">हिन्दी में मदद के लिए कॉल करें</div>
  </div>`;
function search(v){ state.q=v; const g=document.getElementById('shopArea'); if(g) g.innerHTML = shopArea(); else location.hash='#shop/all'; }

/* ── tiles ───────────────────────────────────────────────────────── */
const card = (p, wide=false) => `<a class="card ${wide?'wide':''}" href="javascript:void(0)" onclick="openProduct(${p.id})"><div class="img">${pic(p)}<span class="wl ${wish.includes(p.id)?'on':''}" data-wl="${p.id}" onclick="toggleWish(${p.id},event)" title="Wishlist">♥</span></div><div class="in"><span class="mk label muted"><img src="img/${maker(p).img}.jpg" alt=""><span>${esc(maker(p).n)} · ${esc(maker(p).place.split(',')[0])}</span></span><span class="n">${esc(p.n)}</span><span class="craft">${esc(p.craft)}</span><span class="p">${fmt(p.price)}${p.was?`<s>${fmt(p.was)}</s>`:''}</span></div></a>`;
/* every 7th tile is double-width so the grid has a rhythm */
const tiles = list => list.map((p,i)=>card(p, i%7===3)).join('');
const SORTS = {newest:'Newest', 'price-asc':'Price: low to high', 'price-desc':'Price: high to low', sale:'Discounted first', name:'Name A–Z'};
function sortList(l){ const a=[...l]; switch(state.sort){
  case 'price-asc': return a.sort((x,y)=>x.price-y.price);
  case 'price-desc': return a.sort((x,y)=>y.price-x.price);
  case 'sale': return a.sort((x,y)=>((y.was?1:0)-(x.was?1:0)) || (y.id-x.id));
  case 'name': return a.sort((x,y)=>x.n.localeCompare(y.n));
  default: return a.sort((x,y)=>y.id-x.id); } }
function setSort(v){ state.sort=v; const g=document.getElementById('shopArea'); if(g) g.innerHTML=shopArea(); }
const sortSel = () => `<select class="sortsel" onchange="setSort(this.value)" title="Sort">${Object.entries(SORTS).map(([k,v])=>`<option value="${k}" ${state.sort===k?'selected':''}>${v}</option>`).join('')}</select>`;
let featI = 0, featT = null;
function featured(){
  const items = FEATURED.map(byId).filter(Boolean);
  const ctrl = `<div class="ctrl" onclick="event.stopPropagation()"><span class="nav press" onclick="featGo(-1)">‹</span><span class="dots">${items.map((_,k)=>`<span class="d ${k===featI?'on':''}" onclick="featGo(${k},true)"></span>`).join('')}</span><span class="nav press" onclick="featGo(1)">›</span></div>`;
  const slide = p => { const m = maker(p); return `<div class="fslide">
    <div class="ph" onclick="openProduct(${p.id})">${pic(p)}<span class="tag">From the workshop</span>${ctrl}</div>
    <div class="tx">
      <div class="who"><img src="img/${m.img}.jpg" alt=""><div><div style="font-weight:700">${esc(m.n)}</div><span class="label muted">${esc(m.craft)} · ${esc(m.place)}</span></div></div>
      <h2>${esc(p.n)}</h2>
      <q>${esc(m.en.split('. ').slice(0,2).join('. ').replace(/\.$/,''))}.</q>
      <div class="pr">${fmt(p.price)}${p.was?` <s class="mono muted" style="font:400 14px 'IBM Plex Mono'">${fmt(p.was)}</s>`:''}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ink neo" onclick="openProduct(${p.id})">See the piece</button><a class="btn neo" href="#artist/${p.mk}">Meet the maker</a></div>
    </div>
  </div>`; };
  return `<div class="feat" onmouseenter="clearInterval(featT)" onmouseleave="featArm()">
    <div class="ftrack" id="ftrack" style="transform:translateX(-${featI*100}%)">${items.map(slide).join('')}</div>
  </div>`;
}
function featGo(n, abs){
  const t = document.getElementById('ftrack'); if(!t) return; const N = t.children.length;
  featI = abs ? n : (featI + n + N) % N;
  t.style.transform = `translateX(-${featI*100}%)`;
  document.querySelectorAll('.feat .dots').forEach(g=>[...g.children].forEach((d,k)=>d.classList.toggle('on', k===featI)));
  featArm();
}
function featArm(){ clearInterval(featT); featT = setInterval(()=>{ if(document.getElementById('ftrack') && !document.hidden) featGo(1); }, 5000); }
const filtered = () => allP().filter(p => (state.cat==='all' || p.cat===state.cat) && (!state.q || (p.n+' '+(p.hi||'')+' '+p.craft+' '+maker(p).n+' '+maker(p).place+' '+catName(p.cat)).toLowerCase().includes(state.q.toLowerCase())));

/* ── screens ─────────────────────────────────────────────────────── */
const S = {};
function shopArea(){
  const list = sortList(filtered());
  const home = state.cat==='all' && !state.q;
  return `${home ? featured() : ''}
  <div class="sec"><h1>${state.q ? `Results for “${esc(state.q)}”` : catName(state.cat)}</h1><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="label muted">${list.length} listing${list.length===1?'':'s'}</span>${sortSel()}</div></div>
  ${list.length ? `<div class="grid shop">${tiles(list)}</div>` : `<div class="empty" style="margin:12px 0">Nothing matches. Try another word or category.</div>`}
  <div class="sec" style="border-top:2px solid var(--fg);padding-top:14px"><span class="label muted">© KalaSutra · UPI · Cards · Ships across India</span><a class="label" href="#login" style="text-decoration:underline">Sell with us →</a></div>`;
}
S.home = () => `<div id="shopArea">${shopArea()}</div>`;
S.shop = S.home;

S.cart = () => {
  const items = cart.map(c=>({...c,p:byId(c.id)})).filter(x=>x.p);
  const sub = cartSub(), ship = shipping(sub), total = sub+ship;
  const ids = new Set(cart.map(c=>c.id));
  const rel = allP().filter(p=>!ids.has(p.id) && items.some(i=>i.p.cat===p.cat || i.p.mk===p.mk)).slice(0,10);
  const canOrder = items.length && addrs.length && pays.length;
  return `
  <div class="sec"><h1>Your cart</h1><span class="label muted">${cartCount()} item${cartCount()===1?'':'s'}</span></div>
  <div class="split">
    <div>
      ${items.length ? items.map(({p,qty})=>`<div class="crow"><div class="thumb" onclick="openProduct(${p.id})">${pic(p)}</div><div class="nm"><div style="font-weight:700;line-height:1.25">${esc(p.n)}</div><span class="label muted">${esc(maker(p).n)} · ${esc(maker(p).place)}</span><div class="mono muted" style="font-size:12px;margin-top:2px">${fmt(p.price)} each</div></div><div class="qty"><button onclick="setQty(${p.id},${qty-1});render()">−</button><span>${qty}</span><button onclick="setQty(${p.id},${qty+1});render()">+</button></div><span style="font-weight:900;min-width:90px;text-align:right">${fmt(p.price*qty)}</span><button class="btn sm ghost" title="Remove" onclick="removeFromCart(${p.id});render()">✕</button></div>`).join('')
      : `<div class="empty">Your cart is empty.<a class="btn ink neo" href="#shop/all">Shop the crafts</a></div>`}
      ${rel.length ? `<div class="sec" style="padding-top:26px"><h2 style="font-size:15px">You may also like</h2><span class="label muted">scroll →</span></div><div class="strip">${rel.map(card).join('')}</div>` : ''}
    </div>
    <div class="sticky">
      <div class="box" style="padding:16px 18px">
        <div class="label" style="margin-bottom:8px">Order summary</div>
        <div class="line"><span class="muted">Subtotal</span><span>${fmt(sub)}</span></div>
        <div class="line"><span class="muted">Shipping</span><span>${sub===0?'—':(ship?fmt(ship):'Free')}</span></div>
        <div class="line" style="font:900 18px 'Archivo'"><span>Total</span><span>${fmt(total)}</span></div>
        ${sub && sub<999 ? `<div class="mono muted" style="font-size:11px;margin-top:6px">Add ${fmt(999-sub)} more for free shipping.</div>`:''}
      </div>
      <div class="box" style="padding:16px 18px;margin-top:12px">
        <div class="label" style="margin-bottom:10px">Deliver to</div>
        ${addrs.length ? addrs.map((a,i)=>`<div class="opt ${i===state.selAddr?'on':''}" onclick="state.selAddr=${i};render()"><span class="rd"></span><div><b>${esc(a.name)}</b> · ${esc(a.phone)}<br><span class="muted">${esc(a.line)}, ${esc(a.city)}, ${esc(a.state)} ${esc(a.pin)}</span></div></div>`).join('') : `<div class="muted" style="font-size:13px;margin-bottom:8px">No address saved yet.</div>`}
        <details ${addrs.length?'':'open'}><summary class="label" style="cursor:pointer;margin:4px 0 8px">+ Add an address</summary>${addrForm()}</details>
      </div>
      <div class="box" style="padding:16px 18px;margin-top:12px">
        <div class="label" style="margin-bottom:10px">Pay with</div>
        ${pays.length ? pays.map((a,i)=>`<div class="opt ${i===state.selPay?'on':''}" onclick="state.selPay=${i};render()"><span class="rd"></span><div><b>${a.type==='upi'?'UPI':'Card'}</b> · <span class="mono">${esc(a.label)}</span></div></div>`).join('') : `<div class="muted" style="font-size:13px;margin-bottom:8px">No payment method saved yet.</div>`}
        <details ${pays.length?'':'open'}><summary class="label" style="cursor:pointer;margin:4px 0 8px">+ Add a payment method</summary>${payForm()}</details>
      </div>
      <button class="btn acc lg neo" style="width:100%;margin-top:12px" ${canOrder?'':'disabled'} onclick="placeOrder()">Place order · ${fmt(total)}</button>
      ${!canOrder && items.length ? `<div class="mono muted" style="font-size:11px;margin-top:6px;text-align:center">Add an address and a payment method to place the order.</div>`:''}
    </div>
  </div>`;
};
function addrForm(){ return `<form class="form" onsubmit="return saveAddr(this)">
  <input name="name" placeholder="Full name" required value="${esc(user.name)}"><input name="phone" placeholder="Mobile" required value="${esc(user.phone)}">
  <input class="full" name="line" placeholder="House, street, area" required>
  <input name="city" placeholder="City" required><input name="state" placeholder="State" required><input name="pin" placeholder="PIN code" required pattern="[0-9]{6}">
  <button class="btn ink neo full" type="submit">Save address</button></form>`; }
function saveAddr(f){ const d=Object.fromEntries(new FormData(f)); addrs.push(d); db.set('ks-addr',addrs); state.selAddr=addrs.length-1; if(!user.name){ user.name=d.name; user.phone=d.phone; db.set('ks-user',user);} toast('Address saved'); render(); return false; }
function delAddr(i){ addrs.splice(i,1); db.set('ks-addr',addrs); state.selAddr=0; render(); }
function payForm(){ return `<form class="form" onsubmit="return savePay(this)">
  <select name="type" class="full" onchange="this.form.querySelector('[name=upi]').hidden=this.value!=='upi';this.form.querySelector('[name=card]').hidden=this.value!=='card';this.form.querySelector('[name=cname]').hidden=this.value!=='card'"><option value="upi">UPI</option><option value="card">Debit / credit card</option></select>
  <input class="full" name="upi" placeholder="yourname@upi">
  <input class="full" name="card" placeholder="Card number" hidden inputmode="numeric"><input class="full" name="cname" placeholder="Name on card" hidden>
  <button class="btn ink neo full" type="submit">Save</button></form>`; }
function savePay(f){ const d=Object.fromEntries(new FormData(f)); let label;
  if(d.type==='upi'){ if(!/^[\w.\-]+@[\w]+$/.test(d.upi||'')){ toast('Enter a valid UPI id'); return false } label=d.upi; }
  else { const num=(d.card||'').replace(/\s/g,''); if(!/^\d{12,19}$/.test(num)){ toast('Enter a valid card number'); return false } label='•••• '+num.slice(-4)+(d.cname?' · '+d.cname:''); }
  pays.push({type:d.type,label}); db.set('ks-pay',pays); state.selPay=pays.length-1; toast('Payment method saved'); render(); return false; }
function delPay(i){ pays.splice(i,1); db.set('ks-pay',pays); state.selPay=0; render(); }
function placeOrder(){
  const items = cart.map(c=>({...c,p:byId(c.id)})).filter(x=>x.p); if(!items.length||!addrs[state.selAddr]||!pays[state.selPay]) return;
  const sub=cartSub(), ship=shipping(sub);
  const o = { no:'KS'+Date.now().toString(36).toUpperCase(), date:new Date().toISOString(), items:items.map(i=>({id:i.id,qty:i.qty,price:i.p.price,n:i.p.n})), sub, ship, total:sub+ship, addr:addrs[state.selAddr], pay:pays[state.selPay], status:'Placed' };
  orders.unshift(o); db.set('ks-orders',orders); cart=[]; db.set('ks-cart',cart); paintBar(); location.hash='#confirmed/'+o.no;
}

S.confirmed = (no) => { const o = orders.find(x=>x.no===no) || orders[0]; return `
<div class="box" style="min-height:calc(100vh - 160px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:40px;margin-top:20px">
  <div style="width:150px;height:150px;border:3px solid var(--fg);border-radius:48px;display:flex;align-items:center;justify-content:center;box-shadow:6px 6px 0 0 var(--ink)"><svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"><path d="M4 12l5 5 11-11"/></svg></div>
  <h1 class="display" style="font-size:clamp(36px,5vw,72px)">Order confirmed</h1>
  <div class="hi" style="font-size:34px;font-weight:700">धन्यवाद${user.name?', '+esc(user.name.split(' ')[0]):''}</div>
  ${o ? `<span class="mono muted" style="font-size:13px">Order ${o.no} · ${o.items.length} item${o.items.length===1?'':'s'} · ${fmt(o.total)} · paid by ${o.pay.type==='upi'?'UPI':'card'}<br>Delivering to ${esc(o.addr.city)} · the makers will accept it within a day · updates by SMS</span>`:''}
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><a class="btn ink neo" href="#account/orders">Your orders</a><a class="btn neo" href="#shop/all">Keep shopping</a></div>
</div>`; };

S.account = (open='') => {
  const ini = (user.name||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase() || '?';
  const acc = (key,title,sub,body) => `<div class="acc-item ${open===key?'on':''}" id="acc-${key}"><div class="hd" onclick="this.parentElement.classList.toggle('on')"><div><div class="display" style="font-size:20px">${title}</div><div class="mono muted" style="font-size:12px;margin-top:4px">${sub}</div></div><span style="font-size:22px">›</span></div><div class="bd">${body}</div></div>`;
  return `
  <div class="sec"><h1>Your account</h1><span class="label muted">${user.name?esc(user.name):'not signed in'}</span></div>
  <div class="split">
    <div>
      ${acc('addr','Address', addrs.length?`${addrs.length} saved`:'nothing saved yet',
        (addrs.length?addrs.map((a,i)=>`<div class="opt" style="cursor:default"><div style="flex:1"><b>${esc(a.name)}</b> · ${esc(a.phone)}<br><span class="muted">${esc(a.line)}, ${esc(a.city)}, ${esc(a.state)} ${esc(a.pin)}</span></div><button class="btn sm ghost" onclick="delAddr(${i})">✕</button></div>`).join(''):`<div class="empty" style="margin-bottom:12px">No address yet. Add one below — it is used at checkout.</div>`) + addrForm())}
      ${acc('pay','Payment', pays.length?`${pays.length} saved`:'nothing saved yet',
        (pays.length?pays.map((a,i)=>`<div class="opt" style="cursor:default"><div style="flex:1"><b>${a.type==='upi'?'UPI':'Card'}</b> · <span class="mono">${esc(a.label)}</span></div><button class="btn sm ghost" onclick="delPay(${i})">✕</button></div>`).join(''):`<div class="empty" style="margin-bottom:12px">No payment method yet.</div>`) + payForm())}
      ${acc('orders','Your orders', orders.length?`${orders.length} order${orders.length===1?'':'s'}`:'no orders yet',
        orders.length?orders.map(o=>`<div class="box" style="padding:14px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span class="mono" style="font-size:12px">${o.no} · ${new Date(o.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span><span class="label" style="color:var(--ok)">${o.status}</span></div>${o.items.map(i=>`<div class="line"><span><a href="javascript:void(0)" onclick="openProduct(${i.id})" style="text-decoration:underline">${esc(i.n)}</a> × ${i.qty}</span><span>${fmt(i.price*i.qty)}</span></div>`).join('')}<div class="line" style="font-weight:900"><span>Total (incl. shipping)</span><span>${fmt(o.total)}</span></div><div class="mono muted" style="font-size:11px;margin-top:6px">To ${esc(o.addr.name)}, ${esc(o.addr.city)} · ${o.pay.type==='upi'?'UPI':'Card'} ${esc(o.pay.label)}</div></div>`).join('')
        :`<div class="empty">You haven't ordered anything yet.<a class="btn ink neo" href="#shop/all">Shop the crafts</a></div>`)}
    </div>

  if(!(upState.photo&&upState.desc&&upState.price)) return;
  const title = (document.getElementById('genTitle')?.textContent || 'New listing').trim();
  const np = {id: 1000+extra.length+1, n:title, mk:'priya', price:Number(document.getElementById('priceInput').value), img:'saree-cream', cat:'sarees', hi:'नई सूची', d:{technique:'Hand block print',materials:'Mulmul cotton · indigo · madder'}};
  extra.push(np); db.set('ks-extra',extra); P.push(np); toast('Listed in your shop'); location.hash='#seller';
}
function toggleStory(btn){ const t=document.getElementById('storyText'); const hi = btn.dataset.hi==='1'; t.textContent = hi ? t.dataset.en : t.dataset.hi; t.className = hi ? '' : 'hi'; btn.dataset.hi = hi ? '0':'1'; btn.textContent = hi ? 'Read in हिन्दी' : 'Read in English'; }

/* ── theme ───────────────────────────────────────────────────────── */
const sun=`<svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>`;
const moon=`<svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
function paintTheme(){ document.getElementById('theme').innerHTML = document.documentElement.classList.contains('dark') ? moon : sun; }
document.getElementById('theme').onclick = () => { const next = !document.documentElement.classList.contains('dark'); const apply=()=>{ document.documentElement.classList.toggle('dark',next); try{localStorage.setItem('ks-theme',next?'dark':'light')}catch(e){} paintTheme(); }; document.startViewTransition ? document.startViewTransition(apply) : apply(); };

/* ── boot ────────────────────────────────────────────────────────── */
if(db.get('ks-side','open')==='closed') document.body.classList.replace('side-open','side-closed');
paintTheme(); paintBar(); paintWish(); render();
</script>
